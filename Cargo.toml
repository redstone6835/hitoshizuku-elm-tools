[workspace]

[package]
name = "cargo-elm"
version = "0.1.0"
edition = "2024"
description = "Hitoshizuku ELM host tooling and cargo-elm subcommand"
license = "GPL-3.0-only"
repository = "https://github.com/redstone6835/hitoshizuku-elm-tools"

[[bin]]
name = "cargo-elm"
path = "src/main.rs"

[dependencies]
elm = { git = "https://github.com/redstone6835/hitoshizuku.git", rev = "ec42efda5badb9c35f3352ed84b244406ad91860", default-features = false, features = ["runtime-model", "macros"] }
kernel-symbols = { git = "https://github.com/redstone6835/hitoshizuku.git", rev = "ec42efda5badb9c35f3352ed84b244406ad91860", default-features = false }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
quote = "=1.0.45"
syn = { version = "=2.0.117", features = ["full", "parsing"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.9.8"
